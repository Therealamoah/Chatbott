department: Laboratory
full_name: Clinical Laboratory
description: >
  The Clinical Laboratory provides diagnostic testing services including blood tests,
  urine analysis, microbiology, clinical chemistry, and haematology. Results are
  typically available within 2-4 hours for routine tests.

services:
  - Blood tests (FBC, RBS, FBS, HbA1c, Lipid profile)
  - Urine analysis
  - Malaria rapid diagnostic tests (RDT)
  - Blood film for parasites
  - Stool examination
  - Clinical chemistry (kidney/liver function)
  - Microbiology and culture sensitivity
  - Blood grouping and cross-match
  - Tuberculosis testing (GeneXpert)
  - COVID-19 testing
